name: CI

on:
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: [master, "release/**"]

jobs:
  gitversion:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      nuGetVersionV2: ${{ steps.gitversion.outputs.nuGetVersionV2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"

      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    needs: gitversion
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore FormAtlas.sln

      - name: Build (netstandard2.0)
        run: >
          dotnet build src/FormAtlas.Tool/FormAtlas.Tool.csproj
          -f netstandard2.0 --no-restore -c Release
          /p:Version=${{ needs.gitversion.outputs.nuGetVersionV2 }}

      - name: Build (all)
        run: >
          dotnet build FormAtlas.sln --no-restore -c Release
          /p:Version=${{ needs.gitversion.outputs.nuGetVersionV2 }}

      - name: Test – FormAtlas.Tool
        run: dotnet test tests/FormAtlas.Tool.Tests/ --no-build -c Release --logger "trx;LogFileName=tool.trx"

      - name: Test – FormAtlas.Semantic
        run: dotnet test tests/FormAtlas.Semantic.Tests/ --no-build -c Release --logger "trx;LogFileName=semantic.trx"

      - name: Test – Integration
        run: dotnet test tests/Integration/ --no-build -c Release --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/*.trx"

  figma-importer:
    name: Figma importer build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/figma-importer
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/figma-importer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

  tag-release:
    name: Tag release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [dotnet, figma-importer, gitversion]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Create and push version tag
        run: |
          VERSION="v${{ needs.gitversion.outputs.semVer }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists — skipping"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "Created and pushed tag $VERSION"
          fi
